<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#border-grad)" stroke-width="2" />
  
  <!-- Architectural 'H' Monogram with Dev Craft Details -->
  <!-- Left Pillar -->
  <path d="M19 17V47" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" />
  <!-- Right Pillar -->
  <path d="M45 17V47" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" />
  <!-- Central Tech Bridge with Node Accent -->
  <path d="M19 32H45" stroke="url(#accent-glow)" stroke-width="5" stroke-linecap="round" />
  <!-- Center Core Beacon -->
  <circle cx="32" cy="32" r="4" fill="#38bdf8" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />
</svg>
